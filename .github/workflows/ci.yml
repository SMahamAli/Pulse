name: Pulse Python checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m ruff check app.py pulse tests
      - run: python -m ruff format --check app.py pulse tests
      - run: python -m compileall -q app.py pulse
      - run: python -m pytest -q -m 'not browser'
      - run: python -m playwright install --with-deps chromium --only-shell
      - run: python -m pytest -q -m browser
